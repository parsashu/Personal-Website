name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /Personal-Website/

      - name: Stage site
        run: |
          mkdir -p _site
          cp -a build/web/. _site/
          # Always publish demo videos from web/content
          rm -rf _site/content
          mkdir -p _site/content
          cp -a web/content/. _site/content/
          rm -rf _site/slides
          mkdir -p _site/slides
          cp -a assets/slides/*.jpg _site/slides/
          touch _site/.nojekyll
          echo "Staged:"
          du -sh _site _site/content _site/slides
          ls -lh _site/content | head
          ls _site/slides | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
