name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /Personal-Website/

      - name: Stage site
        run: |
          mkdir -p _site
          cp -a build/web/. _site/
          # Explicitly publish demo videos (do not rely on flutter web copy alone)
          rm -rf _site/content
          mkdir -p _site/content
          cp -a web/content/. _site/content/
          rm -rf _site/slides
          mkdir -p _site/slides
          cp -a assets/slides/. _site/slides/
          echo "Site contents:"
          du -sh _site _site/content _site/slides
          ls -la _site/content | head -30

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
